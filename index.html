<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងវត្តមានបុគ្គលិក</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;
            touch-action: manipulation;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        .loader {
            border-top-color: #2563eb; /* blue-600 */
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        #video-container, #verification-video-container {
            position: relative; width: 100%; max-width: 500px; margin: auto;
            overflow: hidden; border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.1);
        }
        video { width: 100%; display: block; transform: scaleX(-1); } /* Flip video for mirror effect */
        .combobox-options {
            max-height: 200px; overflow-y: auto; scrollbar-width: thin;
            scrollbar-color: #2563eb #e5e7eb; /* blue-600 gray-200 */
        }
        .combobox-options::-webkit-scrollbar { width: 8px; }
        .combobox-options::-webkit-scrollbar-track { background: #e5e7eb; border-radius: 10px; }
        .combobox-options::-webkit-scrollbar-thumb {
            background-color: #2563eb; border-radius: 10px; border: 2px solid #e5e7eb;
        }
        .card {
            background-color: #ffffff; border: 1px solid #e5e7eb;
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col items-center justify-center min-h-screen p-4">

    <header class="w-full max-w-md mx-auto mb-4">
        <div class="flex items-center space-x-3 p-2">
            <svg class="w-8 h-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /></svg>
            <h1 class="text-xl font-bold text-gray-900">ប្រព័ន្ធវត្តមាន</h1>
        </div>
    </header>

    <div id="main-container" class="w-full max-w-md mx-auto">

        <div id="loading-screen" class="flex flex-col items-center justify-center card p-8">
            <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-24 w-24 mx-auto mb-6"></div>
            <h2 class="text-xl font-semibold text-gray-900">កំពុងរៀបចំប្រព័ន្ធ...</h2>
            <p id="loading-message" class="text-gray-600 mt-2">សូមរង់ចាំបន្តិច</p>
             <div id="loading-error" class="mt-4 text-red-600 font-medium hidden"></div>
        </div>

        <div id="verification-step" class="hidden card p-6">
            <h1 class="text-2xl font-bold text-center mb-2 text-blue-600">ផ្ទៀងផ្ទាត់អត្តសញ្ញាណ</h1>
            <p class="text-center text-gray-600 mb-6">សូមជ្រើសរើសឈ្មោះ និងផ្ទៀងផ្ទាត់ផ្ទៃមុខ</p>
            <div id="combobox" class="relative">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3"><svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg></span>
                    <input type="text" id="combobox-input" class="w-full bg-gray-50 border border-gray-300 rounded-lg py-3 pl-10 pr-4 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-300" placeholder="វាយអត្តលេខ ឬ ឈ្មោះ...">
                </div>
                <div id="combobox-options" class="combobox-options hidden absolute z-10 w-full bg-white border border-gray-200 rounded-lg mt-1 shadow-lg"></div>
            </div>
            <div id="verification-video-container" class="mt-4 hidden"><video id="verification-video" playsinline autoplay muted></video></div>
            <p id="verification-message" class="text-center mt-4 h-6 font-medium"></p>
        </div>

        <div id="check-in-out-step" class="hidden card p-6">
            <div class="flex flex-col items-center mb-4">
                <img id="employee-photo" class="w-32 h-32 rounded-full mx-auto border-4 border-blue-500 object-cover shadow-lg" src="https://placehold.co/128x128/e0e7ff/3730a3?text=Employee" alt="Employee Photo">
                <h2 id="employee-name-display" class="text-2xl font-bold mt-4 text-gray-900"></h2>
                <p id="employee-id-display" class="text-gray-500 text-sm"></p>
            </div>
            <p id="check-in-out-title" class="text-lg mb-4 text-blue-600 font-semibold"></p>
            <div id="video-container" class="mb-4"><video id="qr-video" playsinline></video></div>
            <p id="message" class="text-center mt-4 h-12 font-medium"></p>
            <div id="attendance-log" class="mt-4 text-left bg-gray-100 p-4 rounded-lg max-h-48 overflow-y-auto">
                <h3 class="font-bold mb-3 text-gray-800">កំណត់ត្រាវត្តមានថ្ងៃនេះ</h3>
                <div id="log-content" class="space-y-2"></div>
            </div>
            <button id="logout-button" class="mt-6 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center space-x-2 shadow-lg">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" /></svg>
                <span>ចាកចេញ (Logout)</span>
            </button>
        </div>

        <div id="admin-qr-generator" class="hidden mt-8 card p-6">
            <h2 class="text-xl font-bold text-center mb-4 text-gray-900">QR Code សម្រាប់ទីតាំង</h2>
            <p class="text-center mb-4 text-gray-600">សូមប្រើ QR Code នេះសម្រាប់ Check-in/out</p>
            <div id="qrcode" class="flex justify-center bg-white p-4 rounded-lg shadow-inner"></div>
        </div>
    </div>

    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

    <script>
        // --- DOM Elements ---
        const verificationVideo = document.getElementById('verification-video');
        const qrVideo = document.getElementById('qr-video');
        const messageDiv = document.getElementById('message');
        const verificationMessageDiv = document.getElementById('verification-message');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingMessage = document.getElementById('loading-message');
        const loadingErrorDiv = document.getElementById('loading-error'); // Error message div
        const verificationStep = document.getElementById('verification-step');
        const checkInOutStep = document.getElementById('check-in-out-step');
        const adminQrGenerator = document.getElementById('admin-qr-generator');
        const verificationVideoContainer = document.getElementById('verification-video-container');
        const logContent = document.getElementById('log-content');
        const logoutButton = document.getElementById('logout-button');
        const checkInOutTitle = document.getElementById('check-in-out-title');
        const comboboxInput = document.getElementById('combobox-input');
        const comboboxOptions = document.getElementById('combobox-options');

        // --- Global Variables ---
        let employees = [];
        let selectedEmployee = null;
        let currentStream;
        let qrScanner;
        let khmerVoice = null;
        let wrongLocationAttempts = 0;
        let faceMatcher = null;
        let verificationInterval = null;

        // --- Constants ---
        const GOOGLE_SHEET_ID = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const GOOGLE_SHEET_NAME = 'DIList';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxVk-h1hW8g-_Z-rViFVzzRN8h1b9fNjoleNjj1gaHd42X3C66vVJi1HJARXYTB81rG/exec';
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/weights/';
        const LOCATION_QR_PAYLOAD = "DI_ATTENDANCE_LOCATION_001"; // This MUST match the generated QR
        const FACE_MATCH_THRESHOLD = 0.5; // Confidence level (0.1 to 1.0). 0.5 is a good balance.

        // --- Audio Functions ---
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            khmerVoice = voices.find(voice => voice.lang === 'km-KH') || voices.find(voice => voice.lang.startsWith('km-')) || null;
            if (khmerVoice) {
                console.log("Khmer voice loaded:", khmerVoice.name);
            } else {
                console.warn("Khmer voice not found. Using default.");
            }
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices(); // Initial load

        function speak(text, options = {}) {
            if (!('speechSynthesis' in window)) {
                console.warn("Speech synthesis not supported.");
                return;
            }
            if (options.cancel) {
                window.speechSynthesis.cancel();
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = khmerVoice;
            utterance.lang = 'km-KH';
            utterance.rate = options.rate || 1.0;
            utterance.pitch = options.pitch || 1.0;
            window.speechSynthesis.speak(utterance);
        }

        // --- Utility Functions ---
        function getGoogleDriveImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            
            // Check for profile picture format
            if (url.includes('googleusercontent.com/profile_picture/')) {
                 // Ensure it's the high-res one
                return url.replace(/\/s\d+(-c)?\//, '/s512-c/');
            }

            // Check for drive.google.com format
            let fileId = null;
            let match = url.match(/drive\.google\.com.*[?&]id=([-\w]{25,})/);
            if (match && match[1]) {
                fileId = match[1];
            } else {
                match = url.match(/drive\.google\.com\/file\/d\/([-\w]{25,})\//);
                if (match && match[1]) {
                    fileId = match[1];
                }
            }
            
            if (fileId) {
                // Use the standard web content link
                return `https://docs.google.com/uc?id=${fileId}`;
            }
            
            console.warn("Could not parse GDrive URL:", url);
            return ''; // Return empty if no valid ID found
        }
        
        function parseCsvRow(rowText) {
            if (!rowText) return [];
            const row = [];
            let inQuote = false;
            let currentCell = '';

            for (let i = 0; i < rowText.length; i++) {
                const char = rowText[i];

                if (char === '"') {
                    if (inQuote && rowText[i + 1] === '"') {
                        // This is an escaped quote "" inside a cell
                        currentCell += '"';
                        i++; // Skip the next quote
                    } else {
                        // This is the start or end of a quoted cell
                        inQuote = !inQuote;
                    }
                } else if (char === ',' && !inQuote) {
                    // End of a cell
                    row.push(currentCell.trim().replace(/^"|"$/g, '')); // Trim and remove surrounding quotes
                    currentCell = '';
                } else {
                    // Regular character
                    currentCell += char;
                }
            }
            // Add the last cell
            row.push(currentCell.trim().replace(/^"|"$/g, '')); // Trim and remove surrounding quotes
            return row;
        }

        function stopAllStreams() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            if (verificationInterval) {
                clearInterval(verificationInterval);
                verificationInterval = null;
            }
            verificationVideo.srcObject = null;
            qrVideo.srcObject = null;
        }

        function handleLogout() {
            localStorage.removeItem('loggedInEmployeeId');
            localStorage.removeItem('lastActivityTimestamp');
            selectedEmployee = null;
            faceMatcher = null;
            stopAllStreams();
            
            checkInOutStep.classList.add('hidden');
            verificationStep.classList.remove('hidden');
            
            // Clear inputs and messages
            comboboxInput.value = '';
            comboboxOptions.innerHTML = '';
            comboboxOptions.classList.add('hidden');
            verificationMessageDiv.textContent = '';
            verificationVideoContainer.classList.add('hidden');
            
            // Re-populate combobox
            populateCombobox(employees);
        }
        logoutButton.addEventListener('click', handleLogout);

        function generateLocationQrCode() {
            // Check if user is admin (e.g., specific ID)
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('admin') === '9090') {
                try {
                    adminQrGenerator.classList.remove('hidden');
                    document.getElementById('qrcode').innerHTML = ''; // Clear previous
                    new QRCode(document.getElementById('qrcode'), {
                        text: LOCATION_QR_PAYLOAD,
                        width: 256,
                        height: 256,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } catch (e) {
                    console.error("Failed to generate QR Code:", e);
                }
            }
        }

        // --- Data Fetching ---
        async function fetchEmployeeData() {
            loadingMessage.textContent = 'កំពុងទាញទិន្នន័យបុគ្គលិក...';
            console.log("Starting fetchEmployeeData..."); // STEP 3 Log

            // *** Wrap fetch in try...catch for better error isolation ***
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => {
                    console.error("Fetch timeout triggered."); // Log timeout
                    controller.abort();
                }, 30000); // 30 seconds timeout

                const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${GOOGLE_SHEET_NAME}&headers=1&t=${new Date().getTime()}`;
                console.log("Fetching URL:", url); // STEP 4 Log
                const response = await fetch(url, { signal: controller.signal, cache: "no-store" });
                clearTimeout(timeoutId);
                console.log("Fetch response received, status:", response.status); // STEP 5 Log

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error("Fetch failed:", response.status, errorText.substring(0, 200)); // Log fetch error detail
                    throw new Error(`Network response error (${response.status})`); // Throw specific error
                }
                const csvText = await response.text();
                // console.log("CSV Data Fetched (first 500 chars):", csvText.substring(0, 500));

                const lines = csvText.split('\n');
                console.log(`CSV has ${lines.length} lines.`); // STEP 6 Log

                // *** Wrap parsing/mapping in try...catch ***
                    try {
                        employees = lines.slice(8) // Start from row 9 (index 8)
                            .map((line, lineIndex) => {
                                const rowIndexInSheet = lineIndex + 9;
                                const row = parseCsvRow(line);

                                if (!row || row.length <= 11) return null; // Simplified check

                                const id = row[4] ? String(row[4]).trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '';
                                const nameL = row[11] ? row[11].trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '';
                                const nameK = row[10] ? row[10].trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '';
                                const name = nameL || nameK;

                                if (!id || !name) {
                                    // console.warn(`Skipping row ${rowIndexInSheet}: Missing ID or Name. ID: '${id}', Name: '${name}'`);
                                    return null; // Simplified check
                                }

                                const photoUrl = (row.length > 26 && row[26]) ? getGoogleDriveImageUrl(row[26].trim()) : '';

                                return { id, name, nameK, nameL, photoUrl };
                            })
                            .filter(emp => emp);
                    } catch (parseError) {
                        console.error("!!!! Error during CSV parsing/mapping:", parseError); // Log parsing error
                        throw new Error("មានបញ្ហាក្នុងការអានទិន្នន័យបុគ្គលិក។"); // Throw specific error
                    }


                console.log(`Successfully processed ${employees.length} employees.`); // STEP 7 Log
                const employee9090 = employees.find(emp => emp.id === '9090');
                console.log("--> Is employee 9090 in final array?", !!employee9090); // STEP 8 Log

                if (employees.length === 0 && lines.length > 9) {
                    console.error("!!!! Processing resulted in empty employee list despite CSV having data.");
                    throw new Error("បញ្ជីបុគ្គលិកទទេ បន្ទាប់ពីអានទិន្នន័យ។");
                }

                populateCombobox(employees);
                console.log("populateCombobox called."); // STEP 9 Log
                // *** Return true on success ***
                return true;

            } catch (error) {
                    // *** Re-throw the error to be caught by initialize ***
                console.error('!!!! Error caught within fetchEmployeeData:', error);
                throw error; // Propagate error up
            }
        }

        // --- Combobox Logic ---
        function populateCombobox(data) {
            comboboxOptions.innerHTML = '';
            if (data.length === 0) {
                comboboxOptions.innerHTML = `<div class="p-3 text-gray-500">រកមិនឃើញទិន្នន័យទេ។</div>`;
            }
            data.forEach(employee => {
                const option = document.createElement('div');
                option.className = 'p-3 hover:bg-blue-100 cursor-pointer border-b border-gray-100';
                option.textContent = `${employee.name} (${employee.id})`;
                option.setAttribute('data-id', employee.id);
                option.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    comboboxInput.value = `${employee.name} (${employee.id})`;
                    comboboxOptions.classList.add('hidden');
                    handleEmployeeSelection(employee.id);
                });
                comboboxOptions.appendChild(option);
            });
        }

        comboboxInput.addEventListener('focus', () => {
            populateCombobox(employees); // Show all on focus
            comboboxOptions.classList.remove('hidden');
        });

        comboboxInput.addEventListener('blur', () => {
            // Delay blur to allow click event on options to register
            setTimeout(() => comboboxOptions.classList.add('hidden'), 200);
        });

        comboboxInput.addEventListener('input', () => {
            const filter = comboboxInput.value.toLowerCase();
            const filteredEmployees = employees.filter(emp => 
                emp.name.toLowerCase().includes(filter) || 
                emp.id.toLowerCase().includes(filter) ||
                (emp.nameK && emp.nameK.toLowerCase().includes(filter)) ||
                (emp.nameL && emp.nameL.toLowerCase().includes(filter))
            );
            populateCombobox(filteredEmployees);
            comboboxOptions.classList.remove('hidden');
        });

        // --- Face Verification Logic ---
        async function handleEmployeeSelection(employeeId) {
            selectedEmployee = employees.find(emp => emp.id === employeeId);
            if (!selectedEmployee) {
                verificationMessageDiv.textContent = 'រកមិនឃើញបុគ្គលិកទេ។';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                return;
            }

            if (!selectedEmployee.photoUrl) {
                verificationMessageDiv.textContent = 'បុគ្គលិកនេះមិនមានរូបថតក្នុងប្រព័ន្ធទេ។';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                speak('បុគ្គលិកនេះមិនមានរូបថតក្នុងប្រព័ន្ធទេ');
                return;
            }

            verificationMessageDiv.textContent = 'កំពុងផ្ទុករូបថតយោង...';
            verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-blue-600';
            verificationVideoContainer.classList.add('hidden');
            
            try {
                // Fetch image and create descriptor
                const img = await faceapi.fetchImage(selectedEmployee.photoUrl);
                const detection = await faceapi.detectSingleFace(img, new faceapi.TinyFaceDetectorOptions())
                                                .withFaceLandmarks()
                                                .withFaceDescriptor();
                
                if (!detection) {
                    throw new Error('មិនអាចរកឃើញមុខនៅក្នុងរូបថតយោងទេ។');
                }
                
                faceMatcher = new faceapi.FaceMatcher([detection.descriptor], FACE_MATCH_THRESHOLD);
                
                verificationMessageDiv.textContent = 'សូមដាក់មុខឲ្យចំកាមេរ៉ា...';
                speak('សូមដាក់មុខឲ្យចំកាមេរ៉ា');
                await startVerificationCamera();

            } catch (error) {
                console.error("Error loading reference image:", error);
                verificationMessageDiv.textContent = `បញ្ហា៖ ${error.message}`;
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                speak('មានបញ្ហាក្នុងការផ្ទុករូបថតយោង');
            }
        }

        async function startVerificationCamera() {
            if (verificationInterval) clearInterval(verificationInterval);
            stopAllStreams(); // Stop any existing streams
            
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: false 
                });
                verificationVideo.srcObject = currentStream;
                verificationVideoContainer.classList.remove('hidden');

                verificationInterval = setInterval(async () => {
                    if (verificationVideo.readyState < 3) return; // Wait for video to be ready

                    const detection = await faceapi.detectSingleFace(verificationVideo, new faceapi.TinyFaceDetectorOptions())
                                                    .withFaceLandmarks()
                                                    .withFaceDescriptor();
                    
                    if (detection && faceMatcher) {
                        const match = faceMatcher.findBestMatch(detection.descriptor);
                        if (match.label !== 'unknown') {
                            // MATCH FOUND!
                            clearInterval(verificationInterval);
                            stopAllStreams();
                            verificationVideoContainer.classList.add('hidden');
                            verificationMessageDiv.textContent = `ស្គាល់ជា៖ ${selectedEmployee.name}`;
                            verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-green-600';
                            speak(`សួស្តី ${selectedEmployee.nameK || selectedEmployee.nameL}`);
                            
                            // Save session
                            localStorage.setItem('loggedInEmployeeId', selectedEmployee.id);
                            localStorage.setItem('lastActivityTimestamp', Date.now().toString());
                            
                            setTimeout(() => {
                                verificationStep.classList.add('hidden');
                                displayCheckInOutStep();
                            }, 1500);
                        } else {
                            // No match
                            verificationMessageDiv.textContent = 'មិនស្គាល់, សូមព្យាយាមម្តងទៀត...';
                            verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                        }
                    } else {
                        // No face detected
                        verificationMessageDiv.textContent = 'រកមិនឃើញមុខ, សូមដាក់មុខឲ្យចំ...';
                    }
                }, 700); // Check ~1.5 times per second

            } catch (err) {
                console.error("Camera Error:", err);
                verificationMessageDiv.textContent = 'មិនអាចបើកកាមេរ៉ាបានទេ។';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                speak('មិនអាចបើកកាមេរ៉ាបានទេ');
            }
        }

        // --- QR & Geolocation Logic ---
        function displayCheckInOutStep() {
            // Set employee info
            document.getElementById('employee-name-display').textContent = selectedEmployee.name;
            document.getElementById('employee-id-display').textContent = `ID: ${selectedEmployee.id}`;
            document.getElementById('employee-photo').src = selectedEmployee.photoUrl || 'https://placehold.co/128x128/e0e7ff/3730a3?text=Employee';
            
            updateLogDisplay(); // Load today's log
            checkInOutStep.classList.remove('hidden');
            startQRScanner();
        }

        async function startQRScanner() {
            stopAllStreams(); // Stop verification stream
            messageDiv.textContent = 'កំពុងបើកកាមេរ៉ា QR...';
            messageDiv.className = "text-center mt-4 h-12 font-medium text-blue-600";
            
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } }, 
                    audio: false 
                });
                qrVideo.srcObject = currentStream;
                qrVideo.onloadedmetadata = () => {
                    qrVideo.play();
                    qrScanner = requestAnimationFrame(tick); // Start scanning
                };
            } catch (err) {
                console.error("QR Camera Error:", err);
                messageDiv.textContent = 'មិនអាចបើកកាមេរ៉ាបានទេ។ សូមប្រាកដថាអ្នកអនុញ្ញាតឲ្យប្រើកាមេរ៉ា។';
                messageDiv.className = "text-center mt-4 h-12 font-medium text-red-600";
                speak('មិនអាចបើកកាមេរ៉ាបានទេ');
            }
        }

        function tick() {
            if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
                const canvasElement = document.createElement('canvas');
                canvasElement.width = qrVideo.videoWidth;
                canvasElement.height = qrVideo.videoHeight;
                const canvas = canvasElement.getContext('2d');
                
                canvas.drawImage(qrVideo, 0, 0, canvasElement.width, canvasElement.height);
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    cancelAnimationFrame(qrScanner); // Stop scanning
                    handleQRCode(code.data);
                    return;
                }
            }
            qrScanner = requestAnimationFrame(tick); // Continue scanning
        }

        function handleQRCode(qrData) {
            if (qrData === LOCATION_QR_PAYLOAD) {
                stopAllStreams(); // Stop QR camera
                messageDiv.textContent = 'ទីតាំងត្រឹមត្រូវ! កំពុងបញ្ជូន...';
                messageDiv.className = "text-center mt-4 h-12 font-medium text-green-600";
                speak('ទីតាំងត្រឹមត្រូវ');
                submitAttendance();
            } else {
                wrongLocationAttempts++;
                const message = `QR Code មិនត្រឹមត្រូវ! (${wrongLocationAttempts})`;
                messageDiv.textContent = message;
                messageDiv.className = "text-center mt-4 h-12 font-medium text-red-600";
                speak('QR Code មិនត្រឹមត្រូវ');
                
                // Restart scanner after a short delay
                setTimeout(() => {
                    if (currentStream) { // Only restart if stream wasn't stopped
                        qrScanner = requestAnimationFrame(tick);
                    }
                }, 2000);
            }
        }

        // --- Data Submission ---
        async function submitAttendance() {
            const logs = getTodaysLog();
            const action = (logs.CheckIn && !logs.CheckOut) ? 'Check Out' : 'Check In';

            messageDiv.textContent = `កំពុង ${action}... សូមរង់ចាំ។`;
            messageDiv.className = "text-center mt-4 h-12 font-medium text-blue-600";
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors', // Important for cross-domain requests
                    cache: 'no-cache',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8', // Send as text/plain
                    },
                    body: JSON.stringify({
                        employeeId: selectedEmployee.id,
                        action: action
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const result = await response.json();

                if (result.status === 'success') {
                    const successMessage = `${action} បានជោគជ័យ!`;
                    messageDiv.textContent = successMessage;
                    messageDiv.className = "text-center mt-4 h-12 font-medium text-green-600";
                    speak(successMessage);
                    saveLog(action);
                    updateLogDisplay();
                } else {
                    throw new Error(result.message || 'មានបញ្ហាមិនស្គាល់');
                }

            } catch (error) {
                console.error('Submit Error:', error);
                messageDiv.textContent = `បរាជ័យ៖ ${error.message}`;
                messageDiv.className = "text-center mt-4 h-12 font-medium text-red-600";
                speak(`បរាជ័យ។ ${error.message}`);
            } finally {
                // Restart scanner after 3 seconds in case of error or for next action
                setTimeout(() => {
                    if (checkInOutStep.classList.contains('hidden')) return; // Don't restart if logged out
                    startQRScanner();
                }, 3000);
            }
        }

        // --- Local Log for UI ---
        function saveLog(action) {
            const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
            const key = `attendance_${selectedEmployee.id}_${today}`;
            const logs = getTodaysLog(); // Get current logs
            const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            
            if (action === 'Check In') {
                logs.CheckIn = time;
            } else if (action === 'Check Out') {
                logs.CheckOut = time;
            }
            
            localStorage.setItem(key, JSON.stringify(logs));
        }

        function getTodaysLog() {
            if (!selectedEmployee) return {};
            const today = new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD
            const key = `attendance_${selectedEmployee.id}_${today}`;
            try {
                return JSON.parse(localStorage.getItem(key)) || {};
            } catch (e) {
                return {};
            }
        }

        function updateLogDisplay() {
            const logs = getTodaysLog();
            logContent.innerHTML = ''; // Clear existing
            
            let hasCheckIn = false;
            let hasCheckOut = false;

            if (logs.CheckIn) {
                logContent.innerHTML += `
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-green-700">Check In:</span>
                        <span class="font-bold text-gray-900">${logs.CheckIn}</span>
                    </div>
                `;
                hasCheckIn = true;
            }
            if (logs.CheckOut) {
                logContent.innerHTML += `
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-red-700">Check Out:</span>
                        <span class="font-bold text-gray-900">${logs.CheckOut}</span>
                    </div>
                `;
                hasCheckOut = true;
            }

            if (!hasCheckIn && !hasCheckOut) {
                logContent.innerHTML = `<p class="text-gray-500 italic">មិនទាន់មានកំណត់ត្រាសម្រាប់ថ្ងៃនេះ។</p>`;
            }

            // Update title
            if (hasCheckIn && !hasCheckOut) {
                checkInOutTitle.textContent = "សូមស្កេន QR Code ដើម្បី Check Out";
            } else if (hasCheckIn && hasCheckOut) {
                checkInOutTitle.textContent = "អ្នកបាន Check Out រួចរាល់";
            } else {
                checkInOutTitle.textContent = "សូមស្កេន QR Code ដើម្បី Check In";
            }
        }

        // --- Initialization ---
        async function initialize() {
            console.log("Initialize started."); // STEP 0 Log
            // *** Wrap entire initialization in try...catch ***
            try {
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                    console.error("Application not running on HTTPS or localhost.");
                    loadingScreen.innerHTML = `<div class="card p-6 bg-red-100 border-red-300"><h2 class="text-xl font-semibold text-red-700">បញ្ហាសុវត្ថិភាព</h2><p class="mt-2 text-red-600">កម្មវិធីនេះត្រូវតែដំណើរការលើ HTTPS។</p></div>`;
                    return;
                }
                console.log("HTTPS check passed."); // STEP 1 Log

                loadingMessage.textContent = 'កំពុងផ្ទុក Model សម្គាល់មុខ...';
                console.log("Loading face-api models with timeout..."); // STEP 2 Log
                const modelLoadingPromise = Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                const timeoutPromise = new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('អស់ពេលកំណត់ក្នុងការផ្ទុក Model (20s)')), 20000)
                );

                // *** Await Model Loading within try...catch ***
                try {
                    await Promise.race([modelLoadingPromise, timeoutPromise]);
                    console.log("Face-api models loaded successfully."); // STEP 2.1 Log (Success)
                } catch (modelError) {
                    console.error("!!!! Model loading failed:", modelError); // Log Model failure
                    throw modelError; // Re-throw to be caught by outer catch
                }


                // *** Await Data Fetching within try...catch ***
                try {
                    await fetchEmployeeData(); // Await the data fetch
                    console.log("fetchEmployeeData completed successfully."); // STEP 10 Log
                } catch (fetchError) {
                    console.error("!!!! fetchEmployeeData failed:", fetchError); // Log Data fetch failure
                    throw fetchError; // Re-throw to be caught by outer catch
                }


                // --- Proceed only if models and data loaded ---
                const savedEmployeeId = localStorage.getItem('loggedInEmployeeId');
                const lastActivity = localStorage.getItem('lastActivityTimestamp');
                const now = Date.now();
                const fortyEightHours = 48 * 60 * 60 * 1000;
                console.log("Checking for saved session..."); // STEP 11 Log

                if (savedEmployeeId && lastActivity && (now - parseInt(lastActivity || '0', 10) < fortyEightHours)) {
                    selectedEmployee = employees.find(emp => emp.id === savedEmployeeId);
                    if (selectedEmployee) {
                        console.log("Valid session found, showing check-in/out step."); // STEP 12a Log
                        loadingScreen.classList.add('hidden');
                        displayCheckInOutStep();
                    } else {
                        console.warn("Saved ID not found. Forcing re-verification."); // STEP 12b Log
                        localStorage.removeItem('loggedInEmployeeId');
                        localStorage.removeItem('lastActivityTimestamp');
                        loadingScreen.classList.add('hidden');
                        verificationStep.classList.remove('hidden');
                        generateLocationQrCode();
                    }
                } else {
                    console.log("No valid session, showing verification step."); // STEP 12c Log
                    localStorage.removeItem('loggedInEmployeeId');
                    localStorage.removeItem('lastActivityTimestamp');
                    loadingScreen.classList.add('hidden');
                    verificationStep.classList.remove('hidden');
                    generateLocationQrCode();
                }
                console.log("Initialize finished successfully."); // STEP 13 Log

            } catch (error) {
                // *** Catch ANY error during initialization ***
                console.error("!!!! CRITICAL ERROR during Initialization:", error); // Log ANY error
                loadingMessage.textContent = 'បរាជ័យក្នុងការចាប់ផ្តើមកម្មវិធី។';
                loadingErrorDiv.textContent = `បញ្ហា៖ ${error.message}`; // Show error message in UI
                loadingErrorDiv.classList.remove('hidden'); // Make error visible
                // Hide the spinner maybe
                const loaderElement = loadingScreen.querySelector('.loader');
                if(loaderElement) loaderElement.classList.add('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', initialize);

    </script>
</body>
