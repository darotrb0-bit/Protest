        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            khmerVoice = voices.find(voice => voice.lang === 'km-KH');

                console.warn('Khmer (km-KH) voice not found. Using default browser voice.');
            }
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;

        function speak(text, options = {}) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'km-KH';
                if (khmerVoice) {
                    utterance.voice = khmerVoice;
                }
                utterance.rate = options.rate || 1.0;
                utterance.pitch = options.pitch || 1.0;
                utterance.volume = options.volume || 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                console.error('Speech Synthesis not supported in this browser.');
            }
        }

        // --- Utility to convert Google Drive link ---
        function getGoogleDriveImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            const fileIdMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (fileIdMatch && fileIdMatch[1]) {
                return `https://drive.google.com/uc?export=view&id=${fileIdMatch[1]}`;
            }
            return url;
        }

        // --- Robust CSV Row Parser (Reverted and Enhanced) ---
        function parseCsvRow(rowText) {
            const cells = [];
            let inQuote = false;
            let currentCell = '';
            // Regex to remove zero-width spaces and similar characters
            const zeroWidthSpaceRegex = /[\u200B-\u200D\uFEFF]/g;

            if (!rowText || rowText.trim() === '') {
                return [];
            }

            for (let i = 0; i < rowText.length; i++) {
                const char = rowText[i];

                if (char === '"') {
                    // Handle escaped double quotes "" inside quotes
                    if (inQuote && rowText[i + 1] === '"') {
                        currentCell += '"';
                        i++; // Skip the next quote
                    } else {
                        inQuote = !inQuote; // Toggle quote state
                    }
                } else if (char === ',' && !inQuote) {
                    // End of cell if comma is found outside quotes
                    cells.push(currentCell.trim().replace(zeroWidthSpaceRegex, '')); // Trim and clean cell
                    currentCell = ''; // Reset for next cell
                } else {
                    currentCell += char; // Append character to current cell
                }
            }
            // Add the last cell, trim and clean it
            cells.push(currentCell.trim().replace(zeroWidthSpaceRegex, ''));

            // Final cleaning pass: Remove potential surrounding quotes added by Sheets/CSV export
            return cells.map(cell => {
                if (cell.length >= 2 && cell.startsWith('"') && cell.endsWith('"')) {
                     // Check again after initial parse just in case
                     return cell.slice(1, -1).replace(/""/g, '"').trim().replace(zeroWidthSpaceRegex, '');
                }
                // *** Added another trim and clean here for safety ***
                return cell.trim().replace(zeroWidthSpaceRegex, '');
            });
        }


        // --- Data Fetching ---
        async function fetchEmployeeData() {
            loadingMessage.textContent = 'កំពុងទាញទិន្នន័យបុគ្គលិក...';
            console.log("Starting fetchEmployeeData...");

            try {
                // Add a timeout for the fetch request itself (e.g., 30 seconds)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 seconds timeout

                const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${GOOGLE_SHEET_NAME}&headers=1&t=${new Date().getTime()}`;
                console.log("Fetching URL:", url); // Log URL
                const response = await fetch(url, { signal: controller.signal }); // Pass signal
                clearTimeout(timeoutId); // Clear timeout if fetch succeeds

                if (!response.ok) {
                     const errorText = await response.text(); // Try to get error text
                     throw new Error(`Network response was not ok (${response.status}): ${errorText.substring(0,100)}`);
                }
                const csvText = await response.text();
                // console.log("CSV Data Fetched (first 500 chars):", csvText.substring(0, 500));

                const lines = csvText.split('\n');
                console.log(`CSV has ${lines.length} lines.`);

                employees = lines.slice(8) // Start from row 9 (index 8)
                    .map((line, lineIndex) => {
                        const rowIndexInSheet = lineIndex + 9;
                        const row = parseCsvRow(line);

                         if (!row || row.length <= 11) {
                             return null;
                         }

                        const id = row[4] ? String(row[4]).trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '';
                        const nameL = row[11] ? row[11].trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '';
                        const nameK = row[10] ? row[10].trim().replace(/[\u200B-\u200D\uFEFF]/g, '') : '';
                        const name = nameL || nameK;

                        if (!id || !name) {
                            return null;
                        }

                        const photoUrl = (row.length > 26 && row[26]) ? getGoogleDriveImageUrl(row[26].trim()) : '';

                        // if (id === '9090') {
                        //     console.log(`---> Processing 9090 (Row ${rowIndexInSheet}): ID='${id}' (len:${id.length}), Name='${name}'`);
                        // }

                        return { id, name, photoUrl };
                    })
                    .filter(emp => emp);

                console.log(`Successfully processed ${employees.length} employees.`);
                const employee9090 = employees.find(emp => emp.id === '9090');
                console.log("--> Is employee 9090 in final array?", !!employee9090, employee9090 ? `ID='${employee9090.id}' (len:${employee9090.id.length})` : null);

                // Check if employees array is empty after processing
                if (employees.length === 0 && lines.length > 9) { // Check if lines had data but processing yielded empty
                     console.error("!!!! Processing resulted in empty employee list despite CSV having data. Check parsing logic and Sheet data.");
                     throw new Error("បញ្ជីបុគ្គលិកទទេ បន្ទាប់ពីអានទិន្នន័យ។");
                }


                populateCombobox(employees);
                console.log("populateCombobox called.");
            } catch (error) {
                console.error('!!!! Error in fetchEmployeeData:', error);
                // Check for AbortError specifically
                 if (error.name === 'AbortError') {
                     loadingMessage.textContent = 'អស់ពេលកំណត់ក្នុងការទាញទិន្នន័យ។';
                     loadingScreen.innerHTML = `<div class="card p-6 bg-red-100 border-red-300"><h2 class="text-xl font-semibold text-red-700">បរាជ័យ (Timeout)</h2><p class="mt-2 text-red-600">មិនអាចទាញទិន្នន័យបានទាន់ពេល។ សូមពិនិត្យ Internet ហើយ Refresh។</p></div>`;
                 } else {
                    loadingMessage.textContent = 'បរាជ័យក្នុងការទាញទិន្នន័យ។';
                    loadingScreen.innerHTML = `<div class="card p-6 bg-red-100 border-red-300"><h2 class="text-xl font-semibold text-red-700">បរាជ័យ</h2><p class="mt-2 text-red-600">មិនអាចទាញទិន្នន័យបានទេ។ សូម Refresh។</p><p class="mt-1 text-sm text-red-500">${error.message}</p></div>`;
                 }
            }
        }

        async function initialize() {

            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                 console.error("Application not running on HTTPS or localhost.");

             console.log("HTTPS check passed.");

            // *** START MODIFICATION: Load Models with Timeout ***
            loadingMessage.textContent = 'កំពុងផ្ទុក Model សម្គាល់មុខ...';
             console.log("Loading face-api models with timeout...");
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/weights/';
            const modelLoadingPromise = Promise.all([
                 faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                 faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                 faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
             ]);

             const timeoutPromise = new Promise((_, reject) =>
                 setTimeout(() => reject(new Error('អស់ពេលកំណត់ក្នុងការផ្ទុក Model')), 20000) // 20 seconds timeout
             );

             try {
                 await Promise.race([modelLoadingPromise, timeoutPromise]);
                 console.log("Face-api models loaded successfully.");
                 loadingMessage.textContent = 'កំពុងផ្ទុកទិន្នន័យបុគ្គលិក...'; // Update message before fetching data
                 console.log("Proceeding to fetch employee data...");
             } catch (error) {
                 loadingMessage.textContent = 'បរាជ័យក្នុងការផ្ទុក Model។';
                 console.error("!!!! Model loading error or timeout:", error);
                 loadingScreen.innerHTML = `<div class="card p-6 bg-red-100 border-red-300"><h2 class="text-xl font-semibold text-red-700">បរាជ័យក្នុងការផ្ទុក Model</h2><p class="mt-2 text-red-600">មិនអាចផ្ទុក Model សម្គាល់មុខបានទេ។ សូមព្យាយាម Refresh ទំព័រ។</p><p class="mt-1 text-sm text-red-500">${error.message}</p></div>`;
                 return; // Stop initialization
             }
             // *** END MODIFICATION ***


            const savedEmployeeId = localStorage.getItem('loggedInEmployeeId');
            const lastActivity = localStorage.getItem('lastActivityTimestamp');
            const now = Date.now();
            const fortyEightHours = 48 * 60 * 60 * 1000;
             // console.log(`Saved Employee ID: ${savedEmployeeId}, Last Activity: ${lastActivity}`); // Less verbose

             // Fetch employee data *after* models are loaded
             await fetchEmployeeData();

             // Check if fetchEmployeeData failed (indicated by empty employees array AND loading screen still visible)
             if (employees.length === 0 && !loadingScreen.classList.contains('hidden')) {
                  console.error("fetchEmployeeData seems to have failed, initialization stopped.");
                  // Error message is already displayed by fetchEmployeeData's catch block
                  return;
             }


            if (savedEmployeeId && lastActivity && (now - parseInt(lastActivity || '0', 10) < fortyEightHours)) {
                selectedEmployee = employees.find(emp => emp.id === savedEmployeeId);
                if (selectedEmployee) {
                    loadingScreen.classList.add('hidden');
                    displayCheckInOutStep();
                } else {
                    console.warn("Saved ID not found. Forcing re-verification.");
                    localStorage.removeItem('loggedInEmployeeId');
                    localStorage.removeItem('lastActivityTimestamp');
                    loadingScreen.classList.add('hidden');
                    verificationStep.classList.remove('hidden');
                    generateLocationQrCode();
                }
            } else {
                localStorage.removeItem('loggedInEmployeeId');
                localStorage.removeItem('lastActivityTimestamp');
                loadingScreen.classList.add('hidden');
                verificationStep.classList.remove('hidden');
                 generateLocationQrCode();
            }
        }

         function generateLocationQrCode() { /* ... */ } // Keep as is
        document.addEventListener('DOMContentLoaded', initialize);

    </script>
