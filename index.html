<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងវត្តមានបុគ្គលិក</title>
    <!-- Moved Tailwind to the very top -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Removed defer -->

    <style>
        body {
            font-family: 'Kantumruy Pro', sans-serif;

            position: relative;
            width: 100%;
            max-width: 500px;

            overflow: hidden;

            width: 100%;
            display: block;
        }
        /* Combobox scrollbar styling */
        .combobox-options {
            max-height: 200px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2563eb #e5e7eb; /* blue-600 gray-200 */
        }
        .combobox-options::-webkit-scrollbar {
            width: 8px;
        }
        .combobox-options::-webkit-scrollbar-track {
            background: #e5e7eb; /* bg-gray-200 */

        }

            background-color: #2563eb; /* bg-blue-600 */

            border: 2px solid #e5e7eb; /* bg-gray-200 */

        /* Main card style - changed to white */
        .card {
            background-color: #ffffff; /* bg-white */
            border: 1px solid #e5e7eb; /* border-gray-200 */
            border-radius: 0.75rem; /* rounded-xl */

    </style>
</head>
<body class="text-gray-800 flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header -->
    <header class="w-full max-w-md mx-auto mb-4">
        <div class="flex items-center space-x-3 p-2">
            <svg class="w-8 h-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            <h1 class="text-xl font-bold text-gray-900">ប្រព័ន្ធវត្តមាន</h1>
        </div>

    <div id="main-container" class="w-full max-w-md mx-auto">

        <!-- Loading Screen -->

            <div class="loader ease-linear rounded-full border-8 border-t-8 border-gray-200 h-24 w-24 mx-auto mb-6"></div>
            <h2 class="text-xl font-semibold text-gray-900">កំពុងរៀបចំប្រព័ន្ធ...</h2>
            <p id="loading-message" class="text-gray-600 mt-2">សូមរង់ចាំបន្តិច</p>
        </div>

        <!-- Step 1: Verification -->
        <div id="verification-step" class="hidden card p-6">
            <h1 class="text-2xl font-bold text-center mb-2 text-blue-600">ផ្ទៀងផ្ទាត់អត្តសញ្ញាណ</h1>
            <p class="text-center text-gray-600 mb-6">សូមជ្រើសរើសឈ្មោះ និងផ្ទៀងផ្ទាត់ផ្ទៃមុខ</p>

            <!-- Custom Combobox -->
            <div id="combobox" class="relative">
                <!-- Search Input with Icon -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                        <svg class="w-5 h-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                        </svg>
                    </span>
                    <input type="text" id="combobox-input" class="w-full bg-gray-50 border border-gray-300 rounded-lg py-3 pl-10 pr-4 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-300" placeholder="វាយអត្តលេខ ឬ ឈ្មោះ...">
                </div>
                <!-- Dropdown Options -->

            <div id="verification-video-container" class="mt-4 hidden">

        <!-- Step 2: Check In / Check Out -->
        <div id="check-in-out-step" class="hidden card p-6">
            <div class="flex flex-col items-center mb-4">
                <!-- Larger Employee Photo -->
                <img id="employee-photo" class="w-32 h-32 rounded-full mx-auto border-4 border-blue-500 object-cover shadow-lg" src="https://placehold.co/128x128/e0e7ff/3730a3?text=Employee" alt="Employee Photo">
                <h2 id="employee-name-display" class="text-2xl font-bold mt-4 text-gray-900"></h2>
                <p id="employee-id-display" class="text-gray-500 text-sm"></p>
            </div>

            <p id="check-in-out-title" class="text-lg mb-4 text-blue-600 font-semibold"></p>
            <div id="video-container" class="mb-4">
                <video id="qr-video" playsinline></video>
            </div>
            <p id="message" class="text-center mt-4 h-12 font-medium"></p>

            <!-- Redesigned Attendance Log -->
            <div id="attendance-log" class="mt-4 text-left bg-gray-100 p-4 rounded-lg max-h-48 overflow-y-auto">
                <h3 class="font-bold mb-3 text-gray-800">កំណត់ត្រាវត្តមានថ្ងៃនេះ</h3>
                <div id="log-content" class="space-y-2">
                    <!-- Log content will be populated by JS -->
                </div>
            </div>

            <!-- Logout Button with Icon -->
            <button id="logout-button" class="mt-6 w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 flex items-center justify-center space-x-2 shadow-lg">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                </svg>
                <span>ចាកចេញ (Logout)</span>
            </button>
        </div>

        <!-- Admin QR Code Generator -->
        <div id="admin-qr-generator" class="hidden mt-8 card p-6">
            <h2 class="text-xl font-bold text-center mb-4 text-gray-900">QR Code សម្រាប់ទីតាំង</h2>
            <p class="text-center mb-4 text-gray-600">សូមប្រើ QR Code នេះសម្រាប់ Check-in/out</p>
            <div id="qrcode" class="flex justify-center bg-white p-4 rounded-lg shadow-inner"></div>
        </div>

    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

    <script>
        const verificationVideo = document.getElementById('verification-video');
        const qrVideo = document.getElementById('qr-video');
        const messageDiv = document.getElementById('message');
        const verificationMessageDiv = document.getElementById('verification-message');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingMessage = document.getElementById('loading-message');
        const verificationStep = document.getElementById('verification-step');
        const checkInOutStep = document.getElementById('check-in-out-step');
        const adminQrGenerator = document.getElementById('admin-qr-generator');
        const verificationVideoContainer = document.getElementById('verification-video-container');
        const logContent = document.getElementById('log-content');
        const logoutButton = document.getElementById('logout-button');
        const checkInOutTitle = document.getElementById('check-in-out-title');

        // Combobox elements
        const comboboxInput = document.getElementById('combobox-input');
        const comboboxOptions = document.getElementById('combobox-options');

        let employees = [];
        let selectedEmployee = null;
        let currentStream;
        let qrScanner;
        let khmerVoice = null;
        let wrongLocationAttempts = 0;


        const GOOGLE_SHEET_ID = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const GOOGLE_SHEET_NAME = 'DIList';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxVk-h1hW8g-_Z-rViFVzzRN8h1b9fNjoleNjj1gaHd42X3C66vVJi1HJARXYTB81rG/exec';

        // --- Audio Functions ---
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            khmerVoice = voices.find(voice => voice.lang === 'km-KH');
            if (!khmerVoice) {
                console.warn('Khmer (km-KH) voice not found. Using default browser voice.');
            }
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;

        function speak(text, options = {}) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'km-KH';
                if (khmerVoice) {
                    utterance.voice = khmerVoice;
                }
                utterance.rate = options.rate || 1.0;
                utterance.pitch = options.pitch || 1.0;
                utterance.volume = options.volume || 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                console.error('Speech Synthesis not supported in this browser.');
            }
        }

        // --- Utility to convert Google Drive link ---
        function getGoogleDriveImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            const fileIdMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (fileIdMatch && fileIdMatch[1]) {
                return `https://drive.google.com/uc?export=view&id=${fileIdMatch[1]}`;
            }
            return url;
        }

        // --- Robust CSV Row Parser ---
        function parseCsvRow(rowText) {
            const cells = [];
            let inQuote = false;
            let currentCell = '';

            if (!rowText || rowText.trim() === '') {
                return [];
            }

            for (let i = 0; i < rowText.length; i++) {
                const char = rowText[i];

                if (char === '"') {
                    if (inQuote && rowText[i + 1] === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuote = !inQuote;
                    }
                } else if (char === ',' && !inQuote) {
                    cells.push(currentCell);
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            cells.push(currentCell);

            return cells.map(cell => {
                if (cell.length >= 2 && cell.startsWith('"') && cell.endsWith('"')) {
                    return cell.slice(1, -1).replace(/""/g, '"');
                }
                // *** START MODIFICATION: Trim spaces from each cell after parsing ***
                return cell.replace(/\r$/, '').trim();
                // *** END MODIFICATION ***
            });
        }

        // --- Data Fetching ---
        async function fetchEmployeeData() {
            loadingMessage.textContent = 'កំពុងទាញទិន្នន័យបុគ្គលិក...';
            console.log("Starting fetchEmployeeData..."); // Log: Start fetching

            try {
                const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${GOOGLE_SHEET_NAME}&headers=1&t=${new Date().getTime()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                console.log("CSV Data Fetched (first 500 chars):", csvText.substring(0, 500)); // Log: Fetched CSV data

                const lines = csvText.split('\n');
                console.log(`CSV has ${lines.length} lines.`); // Log: Number of lines
                const rows = lines.map(line => parseCsvRow(line));
                console.log("Parsed Rows (first 5 rows):", rows.slice(0, 5)); // Log: First few parsed rows

                employees = rows.slice(8) // Correct index starting from row 9
                    .map((row, index) => { // Added index for logging
                        // Basic check: Ensure row has at least enough columns for ID and Name K/L
                        if (row.length <= 11) {
                             console.log(`Skipping row at index ${index + 8}: too short (${row.length} columns)`); // Log: Skipped short row
                            return null; // Skip rows that are too short
                        }

                        // Convert ID to string AND Trim
                        const id = row[4] ? String(row[4]).trim() : ''; // Ensure ID is a string and trimmed
                        const nameL = row[11] ? row[11].trim() : '';
                        const nameK = row[10] ? row[10].trim() : '';
                        const name = nameL || nameK; // Prefer L, fallback to K

                        // If ID or Name is missing, skip this employee
                        if (!id || !name) {
                            console.log(`Skipping row at index ${index + 8}: missing ID ('${id}') or Name ('${nameL}', '${nameK}')`); // Log: Skipped row missing ID/Name
                            return null;
                        }

                        // Safely get photoUrl only if the column exists
                        const photoUrl = (row.length > 26 && row[26]) ? getGoogleDriveImageUrl(row[26].trim()) : '';

                        // Log the employee being processed, especially 9090
                        if (id === '9090') {
                            console.log(`Processing employee 9090: ID='${id}', Name='${name}', Photo='${photoUrl}'`);
                        }


                        return { id, name, photoUrl };
                    })
                    .filter(emp => emp); // Filter out any null entries returned above

                console.log(`Processed ${employees.length} employees.`); // Log: Total employees processed
                // Log specifically if 9090 is in the final list
                const employee9090 = employees.find(emp => emp.id === '9090');
                console.log("Is employee 9090 in the final list?", !!employee9090, employee9090); // Log: Check for 9090

                populateCombobox(employees);
                console.log("populateCombobox called."); // Log: Combobox population called
            } catch (error) {
                console.error('Error fetching employee data:', error);
                loadingMessage.textContent = 'បរាជ័យក្នុងការទាញទិន្នន័យបុគ្គលិក។';
            }
        }

        // --- Combobox Logic (Redesigned) ---
        function populateCombobox(data) {
             console.log(`Populating combobox with ${data.length} items.`); // Log: Start populating
            comboboxOptions.innerHTML = '';
            if (data.length === 0) {
                comboboxOptions.innerHTML = `<div class="p-3 text-center text-gray-500">រកមិនឃើញទិន្នន័យ</div>`;
                console.log("Combobox populated with 'No data found'."); // Log: No data message
            }
            data.forEach((emp, index) => { // Added index for logging
                if (index < 10) { // Log only the first 10 being added
                     console.log(`Adding option ${index}: ID='${emp.id}', Name='${emp.name}'`);
                }
                const option = document.createElement('div');
                option.className = 'flex items-center p-3 hover:bg-gray-100 cursor-pointer transition duration-150';
                option.innerHTML = `
                    <img src="${emp.photoUrl || 'https://placehold.co/40x40/e0e7ff/3730a3?text=Pic'}"
                         alt="${emp.name}"
                         class="w-10 h-10 rounded-full mr-3 object-cover border-2 border-gray-300"
                         onerror="this.src='https://placehold.co/40x40/e0e7ff/3730a3?text=Pic'; this.onerror=null;">
                    <div>
                        <div class="font-medium text-gray-900">${emp.name}</div>
                        <div class="text-sm text-gray-600">ID: ${emp.id}</div>
                    </div>
                `;

                option.dataset.id = emp.id;
                option.addEventListener('click', () => {
                    comboboxInput.value = `${emp.id} - ${emp.name}`;
                    comboboxOptions.classList.add('hidden');
                    handleEmployeeSelection(emp.id);
                });
                comboboxOptions.appendChild(option);
            });
             console.log("Finished populating combobox."); // Log: Finished populating
        }

        comboboxInput.addEventListener('focus', () => {
            const filter = comboboxInput.value.toLowerCase().trim();
            console.log(`Focus event. Current filter: '${filter}'`); // Log: Focus event
            const filteredEmployees = employees.filter(emp =>
                emp.name.toLowerCase().includes(filter) || emp.id.toLowerCase().includes(filter)
            );
            console.log(`Focus filter results: ${filteredEmployees.length} items.`); // Log: Focus filter results
            populateCombobox(filteredEmployees);
            comboboxOptions.classList.remove('hidden');
        });
        comboboxInput.addEventListener('blur', () => setTimeout(() => comboboxOptions.classList.add('hidden'), 200));

        comboboxInput.addEventListener('input', () => {
            const filter = comboboxInput.value.toLowerCase().trim();
            console.log(`Input event. Filter: '${filter}'`); // Log: Input event filter
            const filteredEmployees = employees.filter(emp =>
                emp.name.toLowerCase().includes(filter) || emp.id.toLowerCase().includes(filter)
            );
             console.log(`Filtering results: ${filteredEmployees.length} items.`); // Log: Input filter results
             // Log specifically if 9090 matches during search
             if (filter === '9090') {
                 const found9090 = filteredEmployees.some(emp => emp.id === '9090');
                 console.log("Does filter '9090' find employee 9090?", found9090);
             }
            populateCombobox(filteredEmployees);
            comboboxOptions.classList.remove('hidden');
        });

        // --- Face Verification Logic ---
        async function handleEmployeeSelection(employeeId) {
            selectedEmployee = employees.find(emp => emp.id === employeeId);
            if (!selectedEmployee) return;

            // If employee has no photo, skip face verification
            if (!selectedEmployee.photoUrl) {
                verificationMessageDiv.textContent = 'មិនមានរូបថតយោង, កំពុងបន្ត...';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-yellow-600';

                // Directly log in
                localStorage.setItem('loggedInEmployeeId', selectedEmployee.id);
                localStorage.setItem('lastActivityTimestamp', Date.now().toString());

                setTimeout(() => {
                    stopAllStreams();
                    verificationStep.classList.add('hidden');
                    adminQrGenerator.classList.add('hidden');
                    displayCheckInOutStep();
                }, 1500); // Wait 1.5s so user can see message
                return;
            }

            // --- Proceed with face verification if photo exists ---
            verificationMessageDiv.textContent = 'កំពុងរៀបចំកាមេរ៉ា...';
            verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-gray-500';
            verificationVideoContainer.classList.remove('hidden');

            try {
                const referenceImage = await faceapi.fetchImage(selectedEmployee.photoUrl, { crossOrigin: 'anonymous' });
                const referenceDescriptor = await faceapi.detectSingleFace(referenceImage, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

                if (!referenceDescriptor) {
                    verificationMessageDiv.textContent = 'មិនអាចស្វែងរកមុខក្នុងរូបថតយោងបានទេ។';
                    verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                    return;
                }

                startVerificationCamera(referenceDescriptor);
            } catch (error) {
                console.error("Error processing reference image:", error);
                verificationMessageDiv.textContent = 'URL រូបថតមិនត្រឹមត្រូវ ឬមានបញ្ហា CORS។';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
            }
        }

        async function startVerificationCamera(referenceDescriptor) {
            stopAllStreams();
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                verificationVideo.srcObject = currentStream;
                verificationMessageDiv.textContent = 'សូមដាក់មុខឲ្យចំកាមេរ៉ា';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-blue-600';

                const intervalId = setInterval(async () => {
                    if(!currentStream) {
                        clearInterval(intervalId);
                        return;
                    }
                    const detections = await faceapi.detectSingleFace(verificationVideo, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
                    if (detections) {
                        const faceMatcher = new faceapi.FaceMatcher(referenceDescriptor);
                        const bestMatch = faceMatcher.findBestMatch(detections.descriptor);

                        if (bestMatch.label !== 'unknown') {
                            verificationMessageDiv.textContent = 'ផ្ទៀងផ្ទាត់ជោគជ័យ!';
                            verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-green-600';

                            localStorage.setItem('loggedInEmployeeId', selectedEmployee.id);
                            localStorage.setItem('lastActivityTimestamp', Date.now().toString());

                            clearInterval(intervalId);
                            setTimeout(() => { // Add a short delay
                                stopAllStreams();
                                verificationStep.classList.add('hidden');
                                adminQrGenerator.classList.add('hidden');
                                displayCheckInOutStep();
                            }, 1000);
                        } else {
                            verificationMessageDiv.textContent = 'មុខមិនត្រូវគ្នា សូមព្យាយាមម្តងទៀត';
                            verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                        }
                    }
                }, 1000);
            } catch (err) {
                verificationMessageDiv.textContent = 'មិនអាចបើកកាមេរ៉ាបានទេ។';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                console.error("Camera access error:", err);
            }
        }

        // --- QR & Geolocation Logic ---
        function displayCheckInOutStep() {
            document.getElementById('employee-photo').src = selectedEmployee.photoUrl || 'https://placehold.co/128x128/e0e7ff/3730a3?text=Employee';
            // Add error handler for main profile picture
            document.getElementById('employee-photo').onerror = function() {
                this.src='https://placehold.co/128x128/e0e7ff/3730a3?text=Employee';
                this.onerror=null;
            };
            document.getElementById('employee-name-display').textContent = selectedEmployee.name;
            document.getElementById('employee-id-display').textContent = `ID: ${selectedEmployee.id}`;
            updateLogDisplay();
            checkInOutStep.classList.remove('hidden');
            checkInOutTitle.textContent = "សូមស្កេន QR Code ទីតាំង";
            startQRScanner();
        }

        async function startQRScanner() {
            messageDiv.textContent = 'កំពុងបើកកាមេរ៉ា...';
            messageDiv.className = 'text-center mt-4 h-12 font-medium text-yellow-600';
            stopAllStreams();
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
                qrVideo.srcObject = currentStream;
                qrVideo.play();
                messageDiv.textContent = 'សូមតម្រង់កាមេរ៉ាទៅកាន់ QR Code';
                messageDiv.className = 'text-center mt-4 h-12 font-medium text-gray-500';
                qrScanner = requestAnimationFrame(tick);
            } catch (err) {
                 messageDiv.textContent = 'បរាជ័យក្នុងការបើកកាមេរ៉ាក្រោយ។';
                 messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                 console.error("Rear camera error:", err);
            }
        }

        function tick() {
            // Added check to prevent errors if qrVideo is not ready
            if (!qrVideo || qrVideo.readyState !== qrVideo.HAVE_ENOUGH_DATA) {
                 qrScanner = requestAnimationFrame(tick);
                 return;
            }
            try {
                const canvasElement = document.createElement('canvas');
                const canvas = canvasElement.getContext('2d');
                canvasElement.height = qrVideo.videoHeight;
                canvasElement.width = qrVideo.videoWidth;
                canvas.drawImage(qrVideo, 0, 0, canvasElement.width, canvasElement.height);
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    handleQRCode(code.data);
                    return; // Stop scanning once code is found
                }
            } catch (error) {
                 console.error("Error during QR scan tick:", error);
                 // Optionally display an error to the user or just keep trying
            }
            // Keep scanning if no code found or error occurred
            qrScanner = requestAnimationFrame(tick);
        }


        function handleQRCode(qrData) {
            messageDiv.textContent = 'បានស្កេន QR Code! កំពុងពិនិត្យទីតាំង...';
            messageDiv.className = 'text-center mt-4 h-12 font-medium text-yellow-600';

            try {
                const allowedAreaCoords = JSON.parse(qrData);
                if (!Array.isArray(allowedAreaCoords)) throw new Error("Invalid QR data format");

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const userCoords = [position.coords.latitude, position.coords.longitude];
                        if (isPointInPolygon(userCoords, allowedAreaCoords)) {
                            wrongLocationAttempts = 0;
                            cancelAnimationFrame(qrScanner);
                            stopAllStreams();
                            submitAttendance();
                        } else {
                            wrongLocationAttempts++;
                            if (wrongLocationAttempts > 4) {
                                const finalMessage = "ទូរស័ព្ទប្អូនអាចមានបញ្ហា សូមមកជួយក្រុមការងារផ្ទាល់ដើម្បីដោះស្រាយ";
                                messageDiv.textContent = finalMessage;
                                messageDiv.className = 'text-center mt-4 h-12 font-bold text-red-600';
                                speak(finalMessage, { rate: 0.9 });
                                cancelAnimationFrame(qrScanner);
                                stopAllStreams();
                                qrVideo.classList.add('hidden');
                            } else {
                                messageDiv.textContent = 'ទីតាំង GPS មិនត្រឹមត្រូវ';
                                messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                                speak('សូមប្អូនព្យាយាមម្ដងទៀត ប្រហែលទូរស័ព្ទប្អូនបង្ហាញ GPS មិនទាន់ត្រឹមត្រូវ', { rate: 0.9 });

                                setTimeout(() => {
                                    messageDiv.textContent = 'សូមតម្រង់កាមេរ៉ាទៅកាន់ QR Code';
                                    messageDiv.className = 'text-center mt-4 h-12 font-medium text-gray-500';
                                    qrScanner = requestAnimationFrame(tick); // Restart scanning
                                }, 3500);
                            }
                        }
                    },
                    (error) => {
                        messageDiv.textContent = 'មិនអាចទទួលបានទីតាំង GPS។';
                        messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                        speak('បរាជ័យ សូមព្យាយាមម្ដងទៀត');
                        setTimeout(() => {
                            messageDiv.textContent = 'សូមតម្រង់កាមេរ៉ាទៅកាន់ QR Code';
                            messageDiv.className = 'text-center mt-4 h-12 font-medium text-gray-500';
                            qrScanner = requestAnimationFrame(tick);
                         }, 3000);
                    },
                    { enableHighAccuracy: true }
                );
            } catch (e) {
                console.error("Error handling QR Code:", e); // Log the error for debugging
                messageDiv.textContent = 'QR Code មិនត្រឹមត្រូវទេ។';
                messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                speak('បរាជ័យ សូមព្យាយាមម្ដងទៀត');
                setTimeout(() => {
                    messageDiv.textContent = 'សូមតម្រង់កាមេរ៉ាទៅកាន់ QR Code';
                    messageDiv.className = 'text-center mt-4 h-12 font-medium text-gray-500';
                    qrScanner = requestAnimationFrame(tick);
                }, 3000);
            }
        }

        // --- Data Submission ---
        function submitAttendance() {
            const lastLog = getTodaysLog().pop();
            const action = (!lastLog || lastLog.action === 'Check Out') ? 'Check In' : 'Check Out';

            messageDiv.textContent = `កំពុងបញ្ជូន ${action}...`;
            messageDiv.className = 'text-center mt-4 h-12 font-medium text-yellow-600';

            navigator.geolocation.getCurrentPosition(position => {
                const data = {
                    timestamp: new Date().toISOString(),
                    employeeId: selectedEmployee.id,
                    employeeName: selectedEmployee.name,
                    action: action,
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    userAgent: navigator.userAgent
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'cors', // Added mode cors
                    cache: 'no-cache', // Added no-cache
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                })
                .then(response => {
                    // Check if response is ok (status in the range 200-299)
                    if (!response.ok) {
                        // Try to parse error message if server sent JSON error
                        return response.json().catch(() => {
                           throw new Error(`Network response was not ok: ${response.statusText}`);
                        }).then(errData => {
                            throw new Error(errData.message || `Network response was not ok: ${response.statusText}`);
                        });
                    }
                     // Check content type before parsing
                    const contentType = response.headers.get("content-type");
                    if (contentType && contentType.indexOf("application/json") !== -1) {
                        return response.json();
                    } else {
                        // Handle non-JSON responses (like potential redirects or HTML error pages)
                         throw new Error("Received non-JSON response from server.");
                    }
                })
                .then(result => {
                    if (result.status === 'success') {
                        messageDiv.textContent = `${action} បានកត់ត្រាដោយជោគជ័យ!`;
                        messageDiv.className = 'text-center mt-4 h-12 font-medium text-green-600';
                        speak(action === 'Check In' ? 'បាន ស្កេន ចូល ជោគជ័យ' : 'បាន ស្កេន ចេញ ជោគជ័យ');

                        localStorage.setItem('lastActivityTimestamp', Date.now().toString());

                        saveLog(action);
                        updateLogDisplay();
                         // Add delay before restarting QR scanner after successful submission
                        setTimeout(() => {
                           startQRScanner(); // Restart scanning for next action
                        }, 3000); // Wait 3 seconds
                    } else {
                         // Use message from server response if available
                         messageDiv.textContent = result.message || 'មានបញ្ហាក្នុងការបញ្ជូន';
                         messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                         speak('បរាជ័យ សូមព្យាយាមម្ដងទៀត');
                         // Optionally restart scanning after failure
                         setTimeout(() => startQRScanner(), 3000);
                    }
                })
                .catch(error => {
                    console.error('Error submitting attendance:', error);
                    // Display the actual error message
                    messageDiv.textContent = `មានបញ្ហា៖ ${error.message || 'សូមព្យាយាមម្តងទៀត។'}`;
                    messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                    speak('បរាជ័យ សូមព្យាយាមម្ដងទៀត');
                     // Optionally restart scanning after failure
                    setTimeout(() => startQRScanner(), 3000);
                });
            },
            // Geolocation error handling
            (geoError) => {
                 console.error('Geolocation error:', geoError);
                 messageDiv.textContent = `មិនអាចទទួលបានទីតាំង GPS: ${geoError.message}`;
                 messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                 speak('បរាជ័យក្នុងការទទួលបានទីតាំង');
                 // Restart scanning after geolocation error
                 setTimeout(() => startQRScanner(), 3000);
            });
        }


        // --- Local Log for UI ---
        function saveLog(action) {
            const logs = JSON.parse(localStorage.getItem('attendanceLogs') || '{}');
            const today = new Date().toISOString().slice(0, 10);
            if (!logs[selectedEmployee.id]) logs[selectedEmployee.id] = {};
            if (!logs[selectedEmployee.id][today]) logs[selectedEmployee.id][today] = [];

            const time = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit'});
            logs[selectedEmployee.id][today].push({ action, time });
            localStorage.setItem('attendanceLogs', JSON.stringify(logs));
        }

        function getTodaysLog() {
            if (!selectedEmployee) return [];
            const logs = JSON.parse(localStorage.getItem('attendanceLogs') || '{}');
            const today = new Date().toISOString().slice(0, 10);
            return (logs[selectedEmployee.id] && logs[selectedEmployee.id][today]) ? logs[selectedEmployee.id][today] : [];
        }

        function updateLogDisplay() {
            const todaysLog = getTodaysLog();
            if (todaysLog.length === 0) {
                logContent.innerHTML = '<p class="text-gray-500 text-center">មិនទាន់មានកំណត់ត្រាសម្រាប់ថ្ងៃនេះ</p>';
            } else {
                // Redesigned log entry
                logContent.innerHTML = todaysLog.map(log => {
                    const isCheckIn = log.action === 'Check In';
                    const bgColor = isCheckIn ? 'bg-green-100' : 'bg-orange-100';
                    const textColor = isCheckIn ? 'text-green-700' : 'text-orange-700';
                    const icon = isCheckIn ?
                        `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H5.25" /></svg>` :
                        `<svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0-3-3m0 0 3-3m-3 3H8.25" /></svg>`;

                    return `
                    <div class="flex justify-between items-center p-3 rounded-lg ${bgColor} ${textColor}">
                        <div class="flex items-center space-x-2">
                            ${icon}
                            <span class="font-semibold">${log.action}</span>
                         </div>
                        <span class="font-medium text-gray-700">${log.time}</span>
                    </div>
                    `;
                }).join('');
            }
        }

        // --- Utility Functions ---
        function isPointInPolygon(point, polygon) {
             // Ensure polygon is valid
             if (!Array.isArray(polygon) || polygon.length < 3) {
                console.error("Invalid polygon data provided to isPointInPolygon");
                return false;
             }
            let x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                // Ensure polygon points are valid arrays
                if (!Array.isArray(polygon[i]) || polygon[i].length < 2 || !Array.isArray(polygon[j]) || polygon[j].length < 2) {
                     console.warn(`Invalid point data in polygon at index ${i} or ${j}`);
                     continue; // Skip invalid points
                }
                let xi = polygon[i][0], yi = polygon[i][1];
                let xj = polygon[j][0], yj = polygon[j][1];

                // Ensure coordinates are numbers
                if (typeof xi !== 'number' || typeof yi !== 'number' || typeof xj !== 'number' || typeof yj !== 'number') {
                    console.warn(`Non-numeric coordinate found in polygon point at index ${i} or ${j}`);
                    continue; // Skip if coordinates are not numbers
                }


                let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }


        function stopAllStreams() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            if (qrScanner) {
                cancelAnimationFrame(qrScanner);
                qrScanner = null;
            }
        }

        function handleLogout() {
            speak('បានចាកចេញ');
            localStorage.removeItem('loggedInEmployeeId');
            localStorage.removeItem('lastActivityTimestamp');
            window.location.reload();
        }
        logoutButton.addEventListener('click', handleLogout);

        // --- Initialization ---
        async function initialize() {
            // Check for HTTPS early
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                loadingScreen.innerHTML = `
                    <div class="card p-6 bg-red-100 border-red-300">
                        <h2 class="text-xl font-semibold text-red-700">បញ្ហាសុវត្ថិភាព</h2>
                        <p class="mt-2 text-red-600">កម្មវិធីនេះត្រូវតែដំណើរការលើ HTTPS ដើម្បីអាចប្រើប្រាស់កាមេរ៉ា និងទីតាំងបាន។</p>
                    </div>
                `;
                return;
            }

            // Moved face-api model loading here to happen first
            loadingMessage.textContent = 'កំពុងផ្ទុក Model សម្គាល់មុខ...';
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/weights/';
             try {
                 await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                 await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                 await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
             } catch (error) {
                 loadingMessage.textContent = 'បរាជ័យក្នុងការផ្ទុក Model សម្គាល់មុខ។';
                 console.error("Model loading error:", error);
                 // Display a more permanent error message
                 loadingScreen.innerHTML = `
                      <div class="card p-6 bg-red-100 border-red-300">
                          <h2 class="text-xl font-semibold text-red-700">បរាជ័យក្នុងការផ្ទុក Model</h2>
                          <p class="mt-2 text-red-600">មិនអាចផ្ទុក Model សម្គាល់មុខបានទេ។ សូមព្យាយាម Refresh ទំព័រ។</p>
                          <p class="mt-1 text-sm text-red-500">${error.message}</p>
                      </div>
                  `;
                 return; // Stop initialization
             }


            const savedEmployeeId = localStorage.getItem('loggedInEmployeeId');
            const lastActivity = localStorage.getItem('lastActivityTimestamp');
            const now = Date.now();
            const fortyEightHours = 48 * 60 * 60 * 1000;

            // Fetch employee data regardless of login state now
             loadingMessage.textContent = 'កំពុងផ្ទុកទិន្នន័យបុគ្គលិក...';
             await fetchEmployeeData(); // Ensure employee data is loaded

            if (savedEmployeeId && lastActivity && (now - parseInt(lastActivity, 10) < fortyEightHours)) {
                // Find employee from the freshly loaded list
                selectedEmployee = employees.find(emp => emp.id === savedEmployeeId);

                if (selectedEmployee) {
                    loadingScreen.classList.add('hidden');
                    displayCheckInOutStep(); // Go directly to check-in/out
                } else {
                     // Saved ID is invalid or employee removed, force logout/re-verify
                    console.warn("Saved employee ID not found in current list. Forcing re-verification.");
                    localStorage.removeItem('loggedInEmployeeId');
                    localStorage.removeItem('lastActivityTimestamp');
                    loadingScreen.classList.add('hidden');
                    verificationStep.classList.remove('hidden'); // Show verification step
                    // Optionally generate QR code here if needed for verification step
                }
            } else {
                 // No valid saved session, proceed to verification step
                localStorage.removeItem('loggedInEmployeeId');
                localStorage.removeItem('lastActivityTimestamp');

                // Models already loaded, employee data already fetched
                loadingScreen.classList.add('hidden');
                verificationStep.classList.remove('hidden');

                // Generate QR code for location verification if needed in this step
                // This seems misplaced if QR is only for check-in/out step, consider removing if not used here
                const allowedAreaCoords = [
                    [11.414644051244176, 104.76389953785764],
                    [11.414680859433401, 104.76382510655895],
                    [11.414402168735643, 104.76368898445364],
                    [11.414364703220496, 104.76376676851353]
                ];
                 // Check if QR code element exists before creating QRCode instance
                 const qrCodeElement = document.getElementById("qrcode");
                 if (qrCodeElement) {
                     qrCodeElement.innerHTML = ''; // Clear previous QR code if any
                     new QRCode(qrCodeElement, {
                        text: JSON.stringify(allowedAreaCoords),
                        width: 200,
                        height: 200,
                        colorDark : "#111827", // gray-900
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                     });
                     // Make the QR code section visible if it was hidden
                    // adminQrGenerator.classList.remove('hidden'); // Decide if QR should be visible at verification
                 } else {
                     console.error("QR Code element not found.");
                 }
            }
        }

        // Use DOMContentLoaded to ensure the DOM is ready before initialize runs
        document.addEventListener('DOMContentLoaded', initialize);

    </script>
