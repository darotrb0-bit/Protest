    <meta charset="UTF-8">

        <!-- Step 1: Verification -->

            <p class="text-center text-gray-600 mb-6">សូមជ្រើសរើសឈ្មោះ និងផ្ទៀងផ្ទាត់ផ្ទៃមុខ</p>

            <p class="text-center mb-4 text-gray-600">សូមប្រើ QR Code នេះសម្រាប់ Check-in/out</p>

    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>

    <script>
        const verificationVideo = document.getElementById('verification-video');
        const qrVideo = document.getElementById('qr-video');
        const messageDiv = document.getElementById('message');
        const verificationMessageDiv = document.getElementById('verification-message');
        const loadingScreen = document.getElementById('loading-screen');
        const loadingMessage = document.getElementById('loading-message');
        const verificationStep = document.getElementById('verification-step');
        const checkInOutStep = document.getElementById('check-in-out-step');
        const adminQrGenerator = document.getElementById('admin-qr-generator');
        const verificationVideoContainer = document.getElementById('verification-video-container');
        const logContent = document.getElementById('log-content');
        const logoutButton = document.getElementById('logout-button');
        const checkInOutTitle = document.getElementById('check-in-out-title');

        // Combobox elements
        const comboboxInput = document.getElementById('combobox-input');
        const comboboxOptions = document.getElementById('combobox-options');

        let employees = [];
        let selectedEmployee = null;
        let currentStream;
        let qrScanner;
        let khmerVoice = null;
        let wrongLocationAttempts = 0;


        const GOOGLE_SHEET_ID = '1eRyPoifzyvB4oBmruNyXcoKMKPRqjk6xDD6-bPNW6pc';
        const GOOGLE_SHEET_NAME = 'DIList';
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxVk-h1hW8g-_Z-rViFVzzRN8h1b9fNjoleNjj1gaHd42X3C66vVJi1HJARXYTB81rG/exec';

        // --- Audio Functions ---
        function loadVoices() {
            const voices = window.speechSynthesis.getVoices();
            khmerVoice = voices.find(voice => voice.lang === 'km-KH');
            if (!khmerVoice) {
                console.warn('Khmer (km-KH) voice not found. Using default browser voice.');
            }
        }
        window.speechSynthesis.onvoiceschanged = loadVoices;

        function speak(text, options = {}) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'km-KH';
                if (khmerVoice) {
                    utterance.voice = khmerVoice;
                }
                utterance.rate = options.rate || 1.0;
                utterance.pitch = options.pitch || 1.0;
                utterance.volume = options.volume || 1.0;
                window.speechSynthesis.speak(utterance);
            } else {
                console.error('Speech Synthesis not supported in this browser.');
            }
        }

        // --- Utility to convert Google Drive link ---
        function getGoogleDriveImageUrl(url) {
            if (!url || typeof url !== 'string') return '';
            const fileIdMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (fileIdMatch && fileIdMatch[1]) {
                return `https://drive.google.com/uc?export=view&id=${fileIdMatch[1]}`;
            }
            return url;
        }

        // --- Robust CSV Row Parser ---
        function parseCsvRow(rowText) {
            const cells = [];
            let inQuote = false;
            let currentCell = '';

            if (!rowText || rowText.trim() === '') {
                return [];
            }

            for (let i = 0; i < rowText.length; i++) {
                const char = rowText[i];

                if (char === '"') {
                    if (inQuote && rowText[i + 1] === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuote = !inQuote;
                    }
                } else if (char === ',' && !inQuote) {
                    cells.push(currentCell);
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            cells.push(currentCell);

            return cells.map(cell => {
                if (cell.length >= 2 && cell.startsWith('"') && cell.endsWith('"')) {
                    // Remove surrounding quotes and unescape double quotes
                    return cell.slice(1, -1).replace(/""/g, '"').trim();
                }
                // Remove trailing \r and trim whitespace
                return cell.replace(/\r$/, '').trim();
            });
        }


        // --- Data Fetching ---
        async function fetchEmployeeData() {
            loadingMessage.textContent = 'កំពុងទាញទិន្នន័យបុគ្គលិក...';
            console.log("Starting fetchEmployeeData..."); // Log: Start fetching

            try {
                const url = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${GOOGLE_SHEET_NAME}&headers=1&t=${new Date().getTime()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Network response was not ok (${response.status})`);
                const csvText = await response.text();
                console.log("CSV Data Fetched (first 500 chars):", csvText.substring(0, 500)); // Log: Fetched CSV data

                const lines = csvText.split('\n');
                console.log(`CSV has ${lines.length} lines.`); // Log: Number of lines

                // Start parsing from the first line after the header (line 9 in sheets -> index 8 in lines array)
                employees = lines.slice(8)
                    .map((line, lineIndex) => { // Added lineIndex for better logging
                        const rowIndexInSheet = lineIndex + 9; // Calculate original row number in Sheet
                        const row = parseCsvRow(line);

                        // Check if row has enough columns (at least up to Column L - index 11)
                         if (!row || row.length <= 11) {
                             console.log(`Skipping Sheet Row ${rowIndexInSheet}: Row is null or too short (${row ? row.length : 'null'} columns)`);
                             return null;
                         }

                        // Get ID (Column E - index 4), ensure it's a string and trimmed
                        const id = row[4] ? String(row[4]).trim() : '';

                        // Get Name (Prefer Column L - index 11, fallback to Column K - index 10), ensure trimmed
                        const nameL = row[11] ? row[11].trim() : '';
                        const nameK = row[10] ? row[10].trim() : '';
                        const name = nameL || nameK;

                        // If ID or Name is essentially empty after trimming, skip
                        if (!id || !name) {
                            console.log(`Skipping Sheet Row ${rowIndexInSheet}: Missing critical data - ID ('${id}') or Final Name ('${name}')`);
                            return null;
                        }

                        // Safely get photoUrl (Column AA - index 26) only if the column exists
                        const photoUrl = (row.length > 26 && row[26]) ? getGoogleDriveImageUrl(row[26].trim()) : '';

                        // Log specifically for ID 9090 during processing
                        if (id === '9090') {
                            console.log(`---> Found and processing employee 9090 in Sheet Row ${rowIndexInSheet}: ID='${id}' (type: ${typeof id}), Name='${name}', Photo='${photoUrl}'`);
                        }

                        return { id, name, photoUrl };
                    })
                    .filter(emp => emp); // Filter out any null entries from skipped rows

                console.log(`Successfully processed ${employees.length} employees.`); // Log: Total employees processed
                // Check again if 9090 exists in the final array
                const employee9090 = employees.find(emp => emp.id === '9090');
                console.log("--> Is employee 9090 in the final 'employees' array?", !!employee9090, employee9090);

                populateCombobox(employees);
                console.log("populateCombobox called."); // Log: Combobox population called
            } catch (error) {
                console.error('!!!! Error in fetchEmployeeData:', error); // Make error log stand out
                loadingMessage.textContent = 'បរាជ័យក្នុងការទាញទិន្នន័យបុគ្គលិក។';
                // Display error more prominently if needed
                loadingScreen.innerHTML = `
                      <div class="card p-6 bg-red-100 border-red-300">
                          <h2 class="text-xl font-semibold text-red-700">បរាជ័យក្នុងការផ្ទុកទិន្នន័យ</h2>
                          <p class="mt-2 text-red-600">មិនអាចទាញទិន្នន័យបុគ្គលិកបានទេ។ សូមព្យាយាម Refresh ទំព័រ។</p>
                          <p class="mt-1 text-sm text-red-500">${error.message}</p>
                      </div>
                  `;
            }
        }


        // --- Combobox Logic (Redesigned) ---
        function populateCombobox(data) {
             console.log(`Populating combobox with ${data.length} items.`); // Log: Start populating
            comboboxOptions.innerHTML = '';
            if (data.length === 0) {
                comboboxOptions.innerHTML = `<div class="p-3 text-center text-gray-500">រកមិនឃើញទិន្នន័យ</div>`;
                console.log("Combobox populated with 'No data found'."); // Log: No data message
                return; // Exit if no data
            }

            data.forEach((emp, index) => { // Added index for logging
                if (index < 5 || emp.id === '9090') { // Log first 5 and employee 9090
                     console.log(`Adding option ${index}: ID='${emp.id}' (type: ${typeof emp.id}), Name='${emp.name}'`);
                }
                const option = document.createElement('div');
                option.className = 'flex items-center p-3 hover:bg-gray-100 cursor-pointer transition duration-150';
                option.innerHTML = `
                    <img src="${emp.photoUrl || 'https://placehold.co/40x40/e0e7ff/3730a3?text=Pic'}"
                         alt="${emp.name}"
                         class="w-10 h-10 rounded-full mr-3 object-cover border-2 border-gray-300"
                         onerror="this.src='https://placehold.co/40x40/e0e7ff/3730a3?text=Pic'; this.onerror=null;">
                    <div>
                        <div class="font-medium text-gray-900">${emp.name}</div>
                        <div class="text-sm text-gray-600">ID: ${emp.id}</div>
                    </div>
                `;

                option.dataset.id = emp.id;
                option.addEventListener('click', () => {
                    comboboxInput.value = `${emp.id} - ${emp.name}`;
                    comboboxOptions.classList.add('hidden');
                    handleEmployeeSelection(emp.id);
                });
                comboboxOptions.appendChild(option);
            });
             console.log("Finished populating combobox."); // Log: Finished populating
        }

        comboboxInput.addEventListener('focus', () => {
            const currentInput = comboboxInput.value.toLowerCase().trim();
            console.log(`Focus event. Current input value: '${currentInput}'`); // Log: Focus event
            // Filter based on the current input value when focusing
            const filteredEmployees = employees.filter(emp =>
                 emp.name.toLowerCase().includes(currentInput) || emp.id.toLowerCase().includes(currentInput)
            );
            console.log(`Focus filter results: ${filteredEmployees.length} items.`); // Log: Focus filter results
            populateCombobox(filteredEmployees);
            comboboxOptions.classList.remove('hidden'); // Ensure dropdown is shown
        });

        comboboxInput.addEventListener('blur', () => {
            // Delay hiding to allow click event on options to register
            setTimeout(() => {
                comboboxOptions.classList.add('hidden');
                console.log("Combobox options hidden on blur.");
             }, 200);
        });

        comboboxInput.addEventListener('input', () => {
            const filterValue = comboboxInput.value.toLowerCase().trim();
            console.log(`Input event. Filter value: '${filterValue}'`); // Log: Input event filter
            const filteredEmployees = employees.filter(emp =>
                 emp.name.toLowerCase().includes(filterValue) || emp.id.toLowerCase().includes(filterValue)
            );
             console.log(`Filtering results: ${filteredEmployees.length} items.`); // Log: Input filter results
             // Log if 9090 matches during search more clearly
             if (filterValue === '9090' || filterValue.includes('9090')) {
                 const found9090 = filteredEmployees.some(emp => emp.id === '9090');
                 console.log(`---> Does current filter ('${filterValue}') find employee 9090 in filtered list?`, found9090);
                 // Also check if 9090 exists in the *original* list for comparison
                 const existsInOriginal = employees.some(emp => emp.id === '9090');
                 console.log(`---> Does 9090 exist in the *original* employees list?`, existsInOriginal);
             }
            populateCombobox(filteredEmployees);
            comboboxOptions.classList.remove('hidden'); // Ensure dropdown is shown while typing
        });


        // --- Face Verification Logic ---
        async function handleEmployeeSelection(employeeId) {
             console.log(`Employee selected: ID='${employeeId}'`); // Log selected ID
            selectedEmployee = employees.find(emp => emp.id === employeeId);
            if (!selectedEmployee) {
                 console.error(`Could not find selected employee data for ID: ${employeeId}`);
                 // Optionally display error to user
                 verificationMessageDiv.textContent = 'មានបញ្ហា។ រកបុគ្គលិកមិនឃើញ។';
                 verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                 return;
            }
             console.log("Selected employee data:", selectedEmployee);

            // If employee has no photo, skip face verification
            if (!selectedEmployee.photoUrl) {
                console.log("Employee has no photoUrl, skipping face verification."); // Log skipping face ID
                verificationMessageDiv.textContent = 'មិនមានរូបថតយោង, កំពុងបន្ត...';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-yellow-600';

                // Directly log in
                localStorage.setItem('loggedInEmployeeId', selectedEmployee.id);
                localStorage.setItem('lastActivityTimestamp', Date.now().toString());

                setTimeout(() => {
                    stopAllStreams();
                    verificationStep.classList.add('hidden');
                    adminQrGenerator.classList.add('hidden');
                    displayCheckInOutStep();
                }, 1500); // Wait 1.5s so user can see message
                return;
            }

            // --- Proceed with face verification if photo exists ---
            console.log("Proceeding with face verification."); // Log starting face ID
            verificationMessageDiv.textContent = 'កំពុងរៀបចំកាមេរ៉ា...';
            verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-gray-500';
            verificationVideoContainer.classList.remove('hidden');

            try {
                console.log("Fetching reference image:", selectedEmployee.photoUrl);
                const referenceImage = await faceapi.fetchImage(selectedEmployee.photoUrl, { crossOrigin: 'anonymous' });
                console.log("Detecting face in reference image...");
                const referenceDescriptor = await faceapi.detectSingleFace(referenceImage, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();

                if (!referenceDescriptor) {
                    console.error("Could not find face in reference image.");
                    verificationMessageDiv.textContent = 'មិនអាចស្វែងរកមុខក្នុងរូបថតយោងបានទេ។';
                    verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
                    return;
                }
                console.log("Reference face descriptor obtained.");
                startVerificationCamera(referenceDescriptor);
            } catch (error) {
                console.error("!!!! Error processing reference image:", error);
                verificationMessageDiv.textContent = `URL រូបថតមិនត្រឹមត្រូវ (${error.message})`;
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-red-600';
            }
        }

        async function startVerificationCamera(referenceDescriptor) {
            console.log("Starting verification camera...");
            stopAllStreams();
            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                verificationVideo.srcObject = currentStream;
                 console.log("Camera stream obtained.");
                verificationMessageDiv.textContent = 'សូមដាក់មុខឲ្យចំកាមេរ៉ា';
                verificationMessageDiv.className = 'text-center mt-4 h-6 font-medium text-blue-600';

                const intervalId = setInterval(async () => {

        async function startQRScanner() {
            console.log("Starting QR Scanner...");
            messageDiv.textContent = 'កំពុងបើកកាមេរ៉ា...';
            messageDiv.className = 'text-center mt-4 h-12 font-medium text-yellow-600';
            stopAllStreams(); // Ensure other streams are stopped
            try {
                // Try environment camera first
                currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
                console.log("Environment camera obtained.");
            } catch (envErr) {
                console.warn("Could not get environment camera, trying user camera:", envErr);
                try {
                    // Fallback to user camera if environment fails
                    currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "user" } } });
                    console.log("User camera obtained as fallback.");
                } catch (userErr) {
                     console.error("!!!! Failed to get any camera stream:", userErr);
                     messageDiv.textContent = 'បរាជ័យក្នុងការបើកកាមេរ៉ា។';
                     messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                     return; // Stop if no camera works
                }
            }

            qrVideo.srcObject = currentStream;
            // Use onloadedmetadata to ensure video dimensions are available before playing
             qrVideo.onloadedmetadata = () => {
                 qrVideo.play().then(() => {
                    console.log("QR video playing.");
                    messageDiv.textContent = 'សូមតម្រង់កាមេរ៉ាទៅកាន់ QR Code';
                    messageDiv.className = 'text-center mt-4 h-12 font-medium text-gray-500';
                    qrScanner = requestAnimationFrame(tick);
                 }).catch(playError => {
                     console.error("!!!! Error playing QR video:", playError);
                     messageDiv.textContent = 'មានបញ្ហាក្នុងការបើកវីដេអូកាមេរ៉ា។';
                     messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                 });
             };
             // Handle potential errors loading video metadata
             qrVideo.onerror = (e) => {
                 console.error("!!!! Error loading QR video metadata:", e);
                 messageDiv.textContent = 'មានបញ្ហាក្នុងការផ្ទុកវីដេអូកាមេរ៉ា។';
                 messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
             };
        }


        function tick() {
            // Check if scanning should continue
            if (!qrScanner) {
                console.log("QR scanner stopped, exiting tick.");
                return;
            }
             // Ensure video stream is active and video element exists
             if (!currentStream || !qrVideo || !qrVideo.srcObject || qrVideo.readyState < qrVideo.HAVE_METADATA) {
                // console.log("QR video not ready, retrying tick..."); // Can be noisy
                qrScanner = requestAnimationFrame(tick);
                return;
             }
             // Ensure video has dimensions
             if (qrVideo.videoWidth === 0 || qrVideo.videoHeight === 0) {
                  // console.log("QR video has zero dimensions, retrying tick..."); // Can be noisy
                 qrScanner = requestAnimationFrame(tick);
                 return;
             }


            try {
                const canvasElement = document.createElement('canvas');
                // Set canvas dimensions based on video dimensions
                canvasElement.width = qrVideo.videoWidth;
                canvasElement.height = qrVideo.videoHeight;
                const canvas = canvasElement.getContext('2d', { willReadFrequently: true }); // Optimization hint

                // Draw video frame to canvas
                canvas.drawImage(qrVideo, 0, 0, canvasElement.width, canvasElement.height);

                // Get image data from canvas
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);

                // Decode QR code from image data
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                     inversionAttempts: "dontInvert", // Optimization: Common QR codes are dark on light
                 });

                if (code && code.data) { // Check if code and code.data exist
                     console.log("QR Code detected:", code.data);
                    // Stop scanning temporarily
                    cancelAnimationFrame(qrScanner);
                    qrScanner = null; // Mark scanner as stopped
                    handleQRCode(code.data);
                    return; // Exit tick loop
                }
            } catch (error) {
                 console.error("!!!! Error during QR scan tick:", error);
                 // Decide if scanning should continue or stop after an error
            }

            // Continue scanning if no code found or non-fatal error occurred
             if (qrScanner) { // Check if it wasn't stopped by handleQRCode
                 qrScanner = requestAnimationFrame(tick);
             }
        }



        function handleQRCode(qrData) {
            console.log("Handling QR Code data:", qrData);
            messageDiv.textContent = 'បានស្កេន QR Code! កំពុងពិនិត្យទីតាំង...';
            messageDiv.className = 'text-center mt-4 h-12 font-medium text-yellow-600';

            let allowedAreaCoords;
            try {
                allowedAreaCoords = JSON.parse(qrData);
                // Basic validation of the parsed data structure
                 if (!Array.isArray(allowedAreaCoords) || allowedAreaCoords.length < 3 || !allowedAreaCoords.every(p => Array.isArray(p) && p.length >= 2 && typeof p[0] === 'number' && typeof p[1] === 'number')) {
                     throw new Error("Invalid polygon data structure in QR code.");
                 }
                 console.log("Parsed allowed area coordinates:", allowedAreaCoords);
            } catch (e) {
                console.error("!!!! Error parsing QR Code JSON:", e);
                messageDiv.textContent = 'QR Code មានទម្រង់មិនត្រឹមត្រូវ។';
                messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                speak('QR Code មិនត្រឹមត្រូវ');
                // Restart scanning after error
                setTimeout(() => startQRScanner(), 3000);
                return; // Stop processing this QR code
            }

            console.log("Requesting current geolocation...");
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const userCoords = [position.coords.latitude, position.coords.longitude];
                     console.log("Geolocation obtained:", userCoords);

                    if (isPointInPolygon(userCoords, allowedAreaCoords)) {
                         console.log("User is within the allowed area.");
                        wrongLocationAttempts = 0;
                        // Stop stream happens in submitAttendance or here if needed
                        stopAllStreams(); // Stop camera before submitting
                        submitAttendance();
                    } else {
                         console.log("User is outside the allowed area.");
                        wrongLocationAttempts++;
                         console.log(`Wrong location attempts: ${wrongLocationAttempts}`);
                        if (wrongLocationAttempts > 4) {
                            const finalMessage = "ទូរស័ព្ទប្អូនអាចមានបញ្ហា សូមមកជួយក្រុមការងារផ្ទាល់ដើម្បីដោះស្រាយ";
                             console.error("Maximum wrong location attempts reached.");
                            messageDiv.textContent = finalMessage;
                            messageDiv.className = 'text-center mt-4 h-12 font-bold text-red-600';
                            speak(finalMessage, { rate: 0.9 });
                            stopAllStreams(); // Stop camera on max attempts
                            qrVideo.classList.add('hidden'); // Hide video element
                        } else {
                            messageDiv.textContent = `ទីតាំង GPS មិនត្រឹមត្រូវ (ព្យាយាម ${wrongLocationAttempts}/5)`;
                            messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';
                            speak('ទីតាំងមិនត្រឹមត្រូវ សូមព្យាយាមម្តងទៀត', { rate: 0.9 });

                            // Restart scanning after delay
                            setTimeout(() => {
                                 console.log("Restarting QR scanner after wrong location attempt.");
                                startQRScanner();
                            }, 3500);
                        }
                    }
                },
                (error) => {
                     console.error("!!!! Geolocation error:", error);
                    messageDiv.textContent = `មិនអាចទទួលបានទីតាំង GPS (${error.code}: ${error.message})។`;
                    messageDiv.className = 'text-center mt-4 h-12 font-medium text-red-600';

                    // Restart scanning after geolocation error
                    setTimeout(() => startQRScanner(), 3000);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000, // Add timeout for geolocation request (10 seconds)
                    maximumAge: 0 // Force fresh location data
                 }
            );
        }

        // --- Utility Functions ---
        function isPointInPolygon(point, polygon) {
             // Ensure polygon is valid
             if (!Array.isArray(polygon) || polygon.length < 3) {
                console.error("Invalid polygon data provided to isPointInPolygon");
                return false;
             }
            let x = point[0], y = point[1];
             if (typeof x !== 'number' || typeof y !== 'number') {
                 console.error("Invalid point data (non-numeric):", point);
                 return false; // Point coordinates must be numbers
             }
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                // Ensure polygon points are valid arrays
                if (!Array.isArray(polygon[i]) || polygon[i].length < 2 || !Array.isArray(polygon[j]) || polygon[j].length < 2) {
                     console.warn(`Invalid point data in polygon at index ${i} or ${j}`);
                     continue; // Skip invalid points
                }
                let xi = polygon[i][0], yi = polygon[i][1];
                let xj = polygon[j][0], yj = polygon[j][1];

                // Ensure coordinates are numbers
                if (typeof xi !== 'number' || typeof yi !== 'number' || typeof xj !== 'number' || typeof yj !== 'number') {
                    console.warn(`Non-numeric coordinate found in polygon point at index ${i} or ${j}`);
                    continue; // Skip if coordinates are not numbers
                }


                let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
             console.log(`isPointInPolygon result for point ${point}: ${inside}`);
            return inside;
        }

                    <div class="card p-6 bg-red-100 border-red-300">
                        <h2 class="text-xl font-semibold text-red-700">បញ្ហាសុវត្ថិភាព</h2>
                        <p class="mt-2 text-red-600">កម្មវិធីនេះត្រូវតែដំណើរការលើ HTTPS ដើម្បីអាចប្រើប្រាស់កាមេរ៉ា និងទីតាំងបាន។</p>
                    </div>
                `;
                return;
            }
             console.log("HTTPS check passed.");

            // Moved face-api model loading here to happen first
            loadingMessage.textContent = 'កំពុងផ្ទុក Model សម្គាល់មុខ...';
             console.log("Loading face-api models...");
            const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/weights/';
             try {
                 await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                 await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                 await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
                 console.log("Face-api models loaded successfully.");
             } catch (error) {
                 loadingMessage.textContent = 'បរាជ័យក្នុងការផ្ទុក Model សម្គាល់មុខ។';
                 console.error("!!!! Model loading error:", error);
                 loadingScreen.innerHTML = `
                      <div class="card p-6 bg-red-100 border-red-300">
                          <h2 class="text-xl font-semibold text-red-700">បរាជ័យក្នុងការផ្ទុក Model</h2>
                          <p class="mt-2 text-red-600">មិនអាចផ្ទុក Model សម្គាល់មុខបានទេ។ សូមព្យាយាម Refresh ទំព័រ។</p>
                          <p class="mt-1 text-sm text-red-500">${error.message}</p>
                      </div>
                  `;
                 return; // Stop initialization
             }


            const savedEmployeeId = localStorage.getItem('loggedInEmployeeId');
            const lastActivity = localStorage.getItem('lastActivityTimestamp');
            const now = Date.now();
            const fortyEightHours = 48 * 60 * 60 * 1000;
             console.log(`Saved Employee ID: ${savedEmployeeId}, Last Activity: ${lastActivity}`);

            // Fetch employee data regardless of login state now
             loadingMessage.textContent = 'កំពុងផ្ទុកទិន្នន័យបុគ្គលិក...';
             await fetchEmployeeData(); // Ensure employee data is loaded before proceeding

            if (savedEmployeeId && lastActivity && (now - parseInt(lastActivity || '0', 10) < fortyEightHours)) {
                 console.log("Valid session found in localStorage.");
                // Find employee from the freshly loaded list
                selectedEmployee = employees.find(emp => emp.id === savedEmployeeId);

                if (selectedEmployee) {
                     console.log("Saved employee found in fetched data. Proceeding to Check In/Out step.");
                    loadingScreen.classList.add('hidden');
                    displayCheckInOutStep(); // Go directly to check-in/out
                } else {
                     // Saved ID is invalid or employee removed, force logout/re-verify
                    console.warn("Saved employee ID not found in current list. Forcing re-verification.");
                    localStorage.removeItem('loggedInEmployeeId');
                    localStorage.removeItem('lastActivityTimestamp');
                    loadingScreen.classList.add('hidden');
                    verificationStep.classList.remove('hidden'); // Show verification step
                    // Generate QR code if needed for this step (or remove if not)
                    generateLocationQrCode();
                }
            } else {
                 console.log("No valid session found or session expired. Proceeding to verification step.");
                 // No valid saved session, proceed to verification step
                localStorage.removeItem('loggedInEmployeeId');
                localStorage.removeItem('lastActivityTimestamp');

                // Models already loaded, employee data already fetched
                loadingScreen.classList.add('hidden');
                verificationStep.classList.remove('hidden');

                // Generate QR code if needed for this step (or remove if not)
                 generateLocationQrCode();
            }
        }

         // Helper function to generate QR code if needed
         function generateLocationQrCode() {
             console.log("Generating location QR code for admin/verification step (if element exists).");
             const allowedAreaCoords = [
                 [11.414644051244176, 104.76389953785764],
                 [11.414680859433401, 104.76382510655895],
                 [11.414402168735643, 104.76368898445364],
                 [11.414364703220496, 104.76376676851353]
             ];
             const qrCodeElement = document.getElementById("qrcode");
             if (qrCodeElement) {
                 qrCodeElement.innerHTML = ''; // Clear previous QR code
                 try {
                     new QRCode(qrCodeElement, {
                        text: JSON.stringify(allowedAreaCoords),
                        width: 200,
                        height: 200,
                        colorDark : "#111827", // gray-900
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                     });
                     console.log("Location QR code generated.");
                     // adminQrGenerator.classList.remove('hidden'); // Uncomment if QR should be visible
                 } catch (qrError) {
                      console.error("!!!! Error generating QR Code:", qrError);
                 }
             } else {
                 console.warn("QR Code element ('qrcode') not found in the DOM.");
             }
         }


        // Use DOMContentLoaded to ensure the DOM is ready before initialize runs
        document.addEventListener('DOMContentLoaded', initialize);

    </script>
